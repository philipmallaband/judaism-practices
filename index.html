<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Judaism Practices Revision</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column app shell; home = grouped game tiles, game view = focused single panel with a top bar */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --ink:#151d36; --muted:#59627e; --line:#dce1ee;
  --accent:#24489c; --accent-ink:#ffffff; --soft:#e5ebf8; --gold:#a8750c; --gold-soft:#fbf1da;
  --good:#1d7f53; --good-soft:#ddf3e7; --bad:#b83434; --bad-soft:#fbe3e3;
  --display:"Frank Ruhl Libre", Georgia, "Times New Roman", serif;
  --body:"Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1322; --surface:#161e35; --ink:#e7ebf7; --muted:#9ca5c3; --line:#28324f;
  --accent:#86a6ff; --accent-ink:#0e1322; --soft:#1c2848; --gold:#e5b850; --gold-soft:#2f2715;
  --good:#53c590; --good-soft:#15332a; --bad:#f07a7a; --bad-soft:#3a1d22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1322; --surface:#161e35; --ink:#e7ebf7; --muted:#9ca5c3; --line:#28324f;
  --accent:#86a6ff; --accent-ink:#0e1322; --soft:#1c2848; --gold:#e5b850; --gold-soft:#2f2715;
  --good:#53c590; --good-soft:#15332a; --bad:#f07a7a; --bad-soft:#3a1d22; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
.wrap{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Masthead: a tallit-stripe band */
.mast{padding-block:28px 22px;display:grid;gap:10px}
.stripes{height:10px;background:linear-gradient(var(--accent),var(--accent)) top/100% 3px no-repeat, linear-gradient(var(--accent),var(--accent)) bottom/100% 3px no-repeat;margin-bottom:6px;max-width:220px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mast h1{font-size:clamp(34px,6vw,54px);font-weight:900}
.mast p{margin:0;color:var(--muted);max-width:62ch}
.statrow{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:6px;font-size:14px;color:var(--muted)}
.statrow b{color:var(--ink);font-variant-numeric:tabular-nums}

.topics{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 26px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.topicnote{font-size:13px;color:var(--muted);margin:-16px 0 22px}

.section{margin-bottom:30px}
.section h2{font-size:24px;margin-bottom:4px}
.section > p{margin:0 0 14px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{display:grid;grid-template-columns:1fr;gap:4px;align-items:start;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s,border-color .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.heb{grid-row:span 3;font-family:var(--display);font-size:30px;line-height:1;color:var(--accent);direction:rtl;min-width:64px;text-align:center;padding-top:4px}
.heb small{display:block;direction:ltr;font-family:var(--body);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.tile h3{font-size:20px}
.tile .desc{font-size:14px;color:var(--muted)}
.best{font-size:12px;font-weight:600;color:var(--gold)}
.best.none{color:var(--muted);font-weight:400}

/* Game view */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px}
.bar h2{font-size:22px;flex:1;min-width:0}
.meter{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.howto{font-size:14px;color:var(--muted);margin:0 0 16px}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--accent);background:var(--soft);border-radius:4px;padding:2px 8px}
.q{font-family:var(--display);font-size:clamp(21px,3.2vw,27px);font-weight:700;margin:10px 0 18px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:baseline}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-weight:700;color:var(--muted);font-size:13px;min-width:16px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.feedback{margin-top:16px;padding:14px 16px;border-radius:8px;font-size:15px}
.feedback.ok{background:var(--good-soft)} .feedback.no{background:var(--bad-soft)}
.feedback b{display:block;margin-bottom:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.btn{border:none;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.goodb{background:var(--good);color:var(--surface)} .btn.badb{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}

/* Results */
.result{text-align:center;padding-block:20px}
.result .big{font-family:var(--display);font-size:64px;font-weight:900;color:var(--accent);line-height:1}
.result p{color:var(--muted);max-width:52ch;margin:10px auto}
.result .row{justify-content:center}
.review{text-align:left;margin-top:20px;display:grid;gap:8px}
.review div{font-size:14px;padding:10px 12px;border-radius:6px;background:var(--bad-soft)}

/* Flashcards */
.fc{perspective:1200px;height:270px;max-width:560px;margin:0 auto;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:10px}
.face.back{transform:rotateY(180deg);background:var(--soft)}
.face .term{font-family:var(--display);font-size:clamp(28px,5vw,40px);font-weight:700}
.face .def{font-size:17px;max-width:44ch}
.face .hint{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fc-in{transition:none}.tile{transition:none}}

/* Match */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}
.mcol{display:grid;gap:10px;align-content:start}
.mi{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;text-align:left;font-size:14px;min-height:52px}
.mi.term{font-weight:600;font-size:15px}
.mi.sel{border-color:var(--accent);background:var(--soft)}
.mi.done{border-color:var(--good);background:var(--good-soft);opacity:.7;cursor:default}
.mi.shake{border-color:var(--bad);background:var(--bad-soft)}

/* Sorter */
.sortcard{text-align:center;padding:30px 18px;border:1px dashed var(--line);border-radius:var(--r);margin-bottom:16px}
.sortcard .item{font-family:var(--display);font-size:clamp(22px,3.6vw,30px);font-weight:700}
.sortcard .sub{color:var(--muted);font-size:14px;margin-top:6px}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bin{border:2px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);font-weight:700;font-size:18px;font-family:var(--display)}
.bin small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.bin:hover:not(:disabled){border-color:var(--accent)}
.streak{color:var(--gold);font-weight:600}

/* Order */
.olist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.olist li{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.olist li .n{font-weight:700;color:var(--muted);width:22px;text-align:center;font-variant-numeric:tabular-nums}
.olist li .t{flex:1;min-width:0}
.olist li.right{border-color:var(--good);background:var(--good-soft)}
.olist li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mv{border:1px solid var(--line);background:var(--bg);border-radius:6px;width:34px;height:34px;font-size:16px;line-height:1}
.mv:disabled{opacity:.3}

/* Synagogue */
.syn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.syn svg{width:100%;max-width:440px;height:auto;display:block;margin:0 auto}
.hs{cursor:pointer}
.hs:hover .shape, .hs:focus .shape{stroke:var(--gold);stroke-width:3}
.hs.found .shape{stroke:var(--good);stroke-width:3}
.hs.miss .shape{stroke:var(--bad);stroke-width:3}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{border:none;background:var(--surface);padding:7px 14px;font-size:14px}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.info h3{font-size:24px;margin-bottom:6px}
.info p{margin:0 0 10px}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.diff div{font-size:14px;background:var(--soft);border-radius:6px;padding:10px}
.diff b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

/* Seder plate */
.plate svg{width:100%;max-width:420px;display:block;margin:0 auto}

/* Argument builder */
.argcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.argcol{border:1px solid var(--line);border-radius:8px;padding:12px;min-height:80px;background:var(--bg)}
.argcol h4{margin:0 0 8px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.argcol ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:6px}
.statement{font-family:var(--display);font-size:clamp(22px,3.4vw,28px);font-weight:700;border-left:4px solid var(--gold);padding-left:14px;margin:8px 0 16px}
.tips{background:var(--gold-soft);border-radius:8px;padding:14px 16px;font-size:14px;margin-top:16px}
.tips ul{margin:6px 0 0;padding-left:18px}

.foot{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

@media (max-width:640px){
  .syn{grid-template-columns:1fr}
  .match{grid-template-columns:1fr 1fr}
  .mi{font-size:13px;padding:8px}
  .diff,.argcols{grid-template-columns:1fr}
  .panel{padding:16px}
}
</style>
</head>

<div class="wrap" id="app"></div>

<script>
/* ============================== CONTENT ============================== */
/* Hebrew terms are limited to the AQA key-words glossary for Judaism (practices). */
const TOPICS = {
  syn:"Synagogue & worship", shab:"Shabbat", texts:"Tenakh & Talmud",
  life:"Life-cycle rituals", diet:"Dietary laws", fest:"Festivals"
};

/* Key words: [term, definition, topic, isAQAglossary] */
const WORDS = [
 ["Synagogue","The place of public worship, also used for study and gathering. Literally means 'coming together'.","syn",1],
 ["Aron hakodesh (ark)","The holiest part of the synagogue, containing the Torah scrolls. It is on the wall facing Jerusalem.","syn",1],
 ["Bimah","The raised reading platform in a synagogue from which the Torah is read.","syn",1],
 ["Ner tamid","The 'ever-burning light' above and in front of the ark; a symbol of God's constant presence.","syn",1],
 ["The Amidah","The 'standing prayer', the central prayer of every Jewish service. Recited standing, facing Jerusalem.","syn",1],
 ["Orthodox Judaism","Jews who believe God gave the complete Torah to Moses, so they live according to Jewish laws and traditions.","syn",1],
 ["Reform Judaism","Jews who believe the Torah was inspired by God and developed through history, so laws may be adapted as life changes.","syn",1],
 ["Liberal Judaism","A form of progressive Judaism combining traditional beliefs and practices with modern interpretations.","syn",1],
 ["Shabbat","The holy day of the week, from sunset on Friday until nightfall on Saturday.","shab",1],
 ["Tenakh (written law)","The Jewish scriptures, in three parts: Torah (Law), Nevi'im (Prophets) and Ketuvim (Writings).","texts",1],
 ["Talmud (oral law)","The oral law believed to have been given to Moses, later written down with the rabbis' discussions and commentary.","texts",1],
 ["Brit Milah","The religious rite of circumcision, performed on a baby boy eight days after birth.","life",1],
 ["Bar Mitzvah","Coming-of-age ceremony for boys at 13. Literally 'son of the commandment'.","life",1],
 ["Bat Mitzvah","Coming-of-age ceremony for girls at 12 (often 13 in Reform). Literally 'daughter of the commandment'.","life",1],
 ["Mourning rituals","Set practices carried out by Jews as a way of grieving for loved ones who have died.","life",1],
 ["Dietary laws","The food laws given by God in the Torah: what may be eaten, combinations of food, and how food is prepared.","diet",1],
 ["Kosher","Food that is 'fit' or 'clean': it meets the requirements of the dietary laws.","diet",1],
 ["Trefah","Forbidden food. Literally 'torn'. It does not meet the dietary laws.","diet",1],
 ["Rosh Hashanah","The Jewish New Year. Starts the ten Days of Awe that end with Yom Kippur.","fest",1],
 ["Yom Kippur","The Day of Atonement: a day of repentance and fasting, ten days after Rosh Hashanah. The holiest day of the year.","fest",1],
 ["Pesach","Festival celebrating the Exodus from Egypt, often called Passover.","fest",1],
 ["Torah","The five books of Moses (Genesis to Deuteronomy), the first part of the Tenakh. Contains 613 commandments.","texts",0],
 ["Prayer quorum","A group of ten adults (ten men in Orthodox Judaism) needed for some communal prayers.","syn",0],
 ["Partition","The screen or upstairs gallery separating men and women in an Orthodox synagogue.","syn",0],
 ["Three daily services","Morning, afternoon and evening prayers, following Daniel, who prayed three times a day (Daniel 6:10).","syn",0],
 ["Doorpost scroll","A small case on the doorposts of a Jewish home holding a scroll of Deuteronomy 6:4–9 ('Hear, O Israel…').","syn",0],
 ["Prayer boxes","Small leather boxes holding Torah passages, worn on the arm and head during weekday morning prayer.","syn",0],
 ["Blessing over wine","Said at the start of the Shabbat meal to make the day holy (Exodus 20:8).","shab",0],
 ["Plaited bread","Two loaves on the Shabbat table recall the double portion of manna in the wilderness (Exodus 16).","shab",0],
 ["End of Shabbat ceremony","Uses wine, sweet spices and a plaited candle to separate holy time from the ordinary week.","shab",0],
 ["39 categories of work","The kinds of work forbidden on Shabbat, as set out in the Talmud (e.g. cooking, writing, lighting a fire).","shab",0],
 ["Jewish law","The rules for everyday life drawn from the Torah and the Talmud.","texts",0],
 ["Marriage canopy","The canopy a couple stand under at a Jewish wedding, symbolising their new home.","life",0],
 ["Marriage contract","Signed before the wedding and read aloud; sets out the husband's duties to his wife.","life",0],
 ["Seven days of mourning","The first period of mourning after the burial. The family stays at home and the community visits.","life",0],
 ["Mourner's prayer","A prayer said by mourners that praises God. It does not mention death.","life",0],
 ["Kosher slaughter","One swift cut by a trained slaughterer to reduce suffering; the blood is then drained.","diet",0],
 ["Neutral foods","Foods that are neither meat nor dairy (fish, eggs, fruit, vegetables), so can be eaten with either.","diet",0],
 ["Ram's horn","Blown at Rosh Hashanah, and at the end of Yom Kippur, as a call to repent.","fest",0],
 ["Days of Awe","The ten days from Rosh Hashanah to Yom Kippur: a time of repentance and asking forgiveness.","fest",0],
 ["Pesach meal","The ritual meal at home on the first night of Pesach, following a set order and retelling the Exodus.","fest",0],
 ["Leavened food","Food made with yeast, such as bread. It is removed from the home before Pesach.","fest",0],
 ["Unleavened bread","Flat bread eaten at Pesach, recalling the haste of leaving Egypt.","fest",0],
];

/* Quiz: [topic, question, [correct, wrong, wrong, wrong], explanation] */
const QUIZ = [
 ["syn","Which feature of the synagogue holds the Torah scrolls?",["Aron hakodesh","Bimah","Ner tamid","The women's gallery"],"The aron hakodesh (ark) is the holiest part of the synagogue. It is set in the wall facing Jerusalem."],
 ["syn","What does the ner tamid symbolise?",["God's constant presence","The ten plagues","The seven days of creation","The twelve tribes"],"The ever-burning light recalls the lampstand that burned continually in the Temple, and shows God is always present."],
 ["syn","Where is the bimah traditionally placed in an Orthodox synagogue?",["In the centre","In the women's gallery","By the entrance","Inside the ark"],"In Orthodox synagogues the bimah is central, so the Torah is read among the people. Reform synagogues often place it at the front."],
 ["syn","What does the word 'synagogue' mean?",["Coming together","House of light","Holy mountain","Place of sacrifice"],"The word comes from Greek and means 'coming together'. The synagogue is a house of prayer, study and meeting."],
 ["syn","Which direction do synagogues usually face?",["Towards Jerusalem","Towards Mount Sinai","Towards the sunset","Towards Egypt"],"The ark is on the wall facing Jerusalem, where the Temple stood."],
 ["syn","In Orthodox Judaism, how many adult men are needed for some communal prayers?",["Ten","Three","Seven","Twelve"],"Orthodox Jews need ten men. Reform Jews count women too, and some do not require ten at all."],
 ["syn","What does 'Amidah' mean?",["Standing","Listening","Bowing","Singing"],"It is the 'standing prayer', said standing with feet together, facing Jerusalem."],
 ["syn","How many blessings are in the weekday Amidah?",["19","7","10","613"],"It was originally 18 (another name for it means 'eighteen'); a 19th was added later. On Shabbat the Amidah has 7 blessings."],
 ["syn","How many times a day do observant Jews pray formally?",["Three","Once","Five","Seven"],"Morning, afternoon and evening, following Daniel, who prayed three times a day (Daniel 6:10)."],
 ["syn","Which is true of most Reform synagogues?",["Men and women sit together","Services are only in Hebrew","Women sit in a gallery","Only men can read from the Torah"],"Reform synagogues have mixed seating and services in Hebrew and English. Women can be rabbis."],
 ["syn","How are men and women separated in an Orthodox synagogue?",["By a screen or an upstairs gallery","They are not separated","They attend on different days","They use separate buildings"],"Orthodox Jews believe this helps everyone concentrate on prayer. Reform synagogues have mixed seating."],
 ["syn","What is inside the small case fixed to the doorposts of a Jewish home?",["A scroll with words from Deuteronomy 6","A piece of unleavened bread","A candle","The Ten Commandments in stone"],"Deuteronomy 6:9 commands Jews to write God's words 'on the door-frames of your houses'."],
 ["syn","When are the small leather prayer boxes worn on the arm and head?",["During weekday morning prayers","Only at weddings","During the Pesach meal","On Shabbat afternoons"],"They follow Deuteronomy 6:8, 'bind them as symbols on your hands and foreheads'. They are not worn on Shabbat or festivals."],
 ["syn","Why do synagogues have no pictures of people or animals?",["To avoid idolatry, following the Ten Commandments","Because they are too expensive","Because Jews dislike art","Because the Talmud bans all colour"],"The second commandment forbids making images to worship. Synagogues use patterns, Hebrew text and symbols instead."],
 ["shab","When does Shabbat begin?",["At sunset on Friday","At midnight on Saturday","At dawn on Saturday","At noon on Friday"],"Jewish days begin at sunset ('there was evening, and there was morning', Genesis 1). Shabbat ends at nightfall on Saturday."],
 ["shab","Why is a blessing said over wine at the start of the Shabbat meal?",["To make Shabbat holy","To remember the dead","To end a fast","To welcome guests"],"It fulfils 'Remember the Sabbath day by keeping it holy' (Exodus 20:8). Wine is a sign of joy."],
 ["shab","Why are there two loaves of plaited bread on the Shabbat table?",["To recall the double portion of manna in the wilderness","For the two tablets of the Law","Because two families share them","To represent day and night"],"God gave a double portion of manna on Friday so no one had to gather it on Shabbat (Exodus 16)."],
 ["shab","How is the end of Shabbat marked?",["A ceremony with wine, sweet spices and a plaited candle","A ram's horn is blown","A fast begins","Bread is thrown into water"],"The ceremony separates holy Shabbat time from the ordinary week. The spices carry the sweetness of Shabbat into the week."],
 ["shab","How many categories of work are forbidden on Shabbat in Orthodox Judaism?",["39","10","7","613"],"The Talmud lists 39 kinds of work, such as cooking, writing and lighting a fire (so Orthodox Jews do not use electricity)."],
 ["shab","Which is a Reform view of Shabbat?",["Driving to the synagogue is acceptable","Electricity must never be used","Only men may light the candles","Shabbat begins on Saturday morning"],"Reform Jews focus on the spirit of Shabbat (rest, family, worship) more than on the detailed rules."],
 ["texts","What are the three parts of the Tenakh?",["Torah, Nevi'im, Ketuvim","Talmud, Torah, Psalms","Genesis, Exodus, Leviticus","Law, Gospels, Letters"],"T-N-K: Torah (Law), Nevi'im (Prophets), Ketuvim (Writings)."],
 ["texts","How many commandments are in the Torah?",["613","10","39","248"],"There are 613 commandments: 248 positive ('do') and 365 negative ('do not')."],
 ["texts","What is the Talmud?",["The oral law, written down with the rabbis' discussions of it","The first five books of the Tenakh","The Jewish prayer book","A collection of psalms"],"Orthodox Jews believe the oral law was given to Moses with the written law. It was written down around 200 CE and discussed by rabbis for centuries."],

function open(id){
  const g = GAMES.find(x=>x.id===id);
  app.innerHTML = `<div class="bar"><button class="back" id="back">← All games</button><h2>${g.name}</h2><span class="meter" id="meter"></span></div><div id="stage"></div>`;
  $("#back").onclick = home;
  window.scrollTo(0,0);
  g.run($("#stage"), g);
}
const meter = t => { const m=$("#meter"); if (m) m.textContent = t; };
const topicLabel = () => S.topic==="all" ? "All topics" : TOPICS[S.topic];

function result(stage, g, score, total, extraHTML="", msg){
  const pct = total ? Math.round(score/total*100) : 0;
  record(g.id, pct);
  const m = msg || (pct>=90 ? "Excellent. You know this well; try another topic or game." : pct>=70 ? "Good work. Look at the ones you missed, then play again." : pct>=50 ? "Getting there. Review the feedback and try again." : "Keep going. Try Flashcards for this topic first, then come back.");
  stage.innerHTML = `<div class="panel result"><div class="eyebrow">${esc(topicLabel())}</div><div class="big">${score}/${total}</div><p>${m}</p>
    <div class="row"><button class="btn" id="again">Play again</button><button class="btn ghost" id="home2">All games</button></div>${extraHTML}</div>`;
  meter(pct+"%");
  $("#again").onclick = ()=>open(g.id); $("#home2").onclick = home;
}

/* ---------- Generic multiple-choice runner ---------- */
function mcq(stage, g, items, opts={}){
  let i=0, score=0; const missed=[];
  const draw = () => {
    if (i>=items.length) return result(stage, g, score, items.length,
      missed.length ? `<div class="review">${missed.map(m=>`<div><b>${esc(m.q)}</b><br>Answer: ${esc(m.a)}</div>`).join("")}</div>` : "");
    const it = items[i]; const choices = shuffle(it.options);
    meter(`${i+1} of ${items.length} · Score ${score}`);
    stage.innerHTML = `<div class="progress"><i style="width:${i/items.length*100}%"></i></div>
      <div class="panel">${opts.howto?`<p class="howto">${opts.howto}</p>`:""}
      <span class="tag">${esc(it.tag)}</span>
      <div class="q">${it.qHTML || esc(it.q)}</div>
      <div class="opts">${choices.map((c,k)=>`<button class="opt" data-c="${esc(c)}"><span class="k">${"ABCD"[k]}</span><span>${esc(c)}</span></button>`).join("")}</div>
      <div id="fb"></div></div>`;
    stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok = b.dataset.c === it.answer;
      stage.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if (x.dataset.c===it.answer) x.classList.add("right"); });
      if (!ok){ b.classList.add("wrong"); missed.push({q:it.q, a:it.answer}); } else score++;
      $("#fb").innerHTML = `<div class="feedback ${ok?"ok":"no"}"><b>${ok?"Correct.":"Not quite."}</b>${esc(it.explain)}</div>
        <div class="row"><button class="btn" id="next">${i+1<items.length?"Next question":"See results"}</button></div>`;
      $("#next").onclick = ()=>{ i++; draw(); }; $("#next").focus();
      meter(`${i+1} of ${items.length} · Score ${score}`);
    });
  };
  draw();
}

function gQuiz(stage, g){
  const pool = shuffle(QUIZ.filter(q=>inTopic(q[0]))).slice(0,10);
  mcq(stage, g, pool.map(q=>({tag:TOPICS[q[0]], q:q[1], options:q[2], answer:q[2][0], explain:q[3]})));
}

function gSources(stage, g){
  const pool = SOURCES.filter(s=>inTopic(s[3]));
  const all = [...new Set(SOURCES.map(s=>s[2]))];
  const items = shuffle(pool).slice(0,10).map(s=>{
    const wrong = shuffle(all.filter(a=>a!==s[2])).slice(0,3);
    return {tag:s[1], q:`"${s[0]}"`, qHTML:`<span style="font-style:italic">“${esc(s[0])}”</span>`, options:[s[2],...wrong], answer:s[2],
      explain:`${s[1]} is a source of authority for ${s[2].toLowerCase().startsWith("the ")?s[2].toLowerCase():s[2]}. Quote or paraphrase it in 5-mark answers, which need a relevant source of wisdom and authority.`};
  });
  mcq(stage, g, items, {howto:"Which practice does this teaching support?"});
}

function gDevelop(stage, g){

/* ---------- Flashcards ---------- */
function gFlash(stage, g){
  let deck = shuffle(WORDS.filter(w=>inTopic(w[2]))), i=0, known=0, again=[];
  const total = deck.length;
  const draw = () => {
    if (i>=deck.length){
      const pct = Math.round(known/total*100); record(g.id, pct);
      stage.innerHTML = `<div class="panel result"><div class="big">${known}/${total}</div><p>You marked ${known} word${known===1?"":"s"} as known.${again.length?` ${again.length} still to learn.`:" All done."}</p>
        <div class="row">${again.length?`<button class="btn" id="redo">Study the ${again.length} again</button>`:""}<button class="btn ghost" id="restart">Start over</button><button class="btn ghost" id="home2">All games</button></div></div>`;
      if (again.length) $("#redo").onclick = ()=>{ deck=shuffle(again); again=[]; i=0; draw(); };
      $("#restart").onclick = ()=>open(g.id); $("#home2").onclick=home; meter(pct+"%"); return;
    }
    const w = deck[i];
    meter(`${i+1} of ${deck.length} · Known ${known}`);
    stage.innerHTML = `<div class="progress"><i style="width:${i/deck.length*100}%"></i></div>
      <div class="fc" id="fc" tabindex="0" role="button" aria-label="Flip card">
        <div class="fc-in">
          <div class="face"><span class="tag">${TOPICS[w[2]]}${w[3]?" · AQA key word":""}</span><div class="term">${esc(w[0])}</div><div class="hint">Tap or press Space to flip</div></div>
          <div class="face back"><div class="term" style="font-size:22px">${esc(w[0])}</div><div class="def">${esc(w[1])}</div></div>
        </div></div>
      <div class="row" style="justify-content:center"><button class="btn badb" id="no">Still learning</button><button class="btn goodb" id="yes">I know it</button></div>`;
    const fc=$("#fc"); const flip=()=>fc.classList.toggle("flip");
    fc.onclick=flip; fc.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); } };
    $("#yes").onclick=()=>{ known++; i++; draw(); };
    $("#no").onclick=()=>{ again.push(w); i++; draw(); };
    fc.focus();
  };
  draw();
}

/* ---------- Match up ---------- */
function gMatch(stage, g){
  const round = shuffle(WORDS.filter(w=>inTopic(w[2]))).slice(0,6);
  let sel=null, done=0, errors=0; const t0=Date.now();
  const timer = setInterval(()=>{ if(!$("#mgrid")) return clearInterval(timer); meter(`${Math.floor((Date.now()-t0)/1000)}s · Mistakes ${errors}`); },500);
  const defs = shuffle(round);
  stage.innerHTML = `<div class="panel"><p class="howto">Tap a key word, then tap its definition.</p>
    <div class="match" id="mgrid"><div class="mcol">${shuffle(round).map(w=>`<button class="mi term" data-k="${esc(w[0])}">${esc(w[0])}</button>`).join("")}</div>
    <div class="mcol">${defs.map(w=>`<button class="mi def" data-k="${esc(w[0])}">${esc(w[1])}</button>`).join("")}</div></div></div>`;
  const all = stage.querySelectorAll(".mi");
  all.forEach(b=>b.onclick=()=>{
    if (b.classList.contains("done")) return;
    if (!sel || sel.classList.contains(b.classList.contains("term")?"term":"def")){
      all.forEach(x=>x.classList.remove("sel")); sel=b; b.classList.add("sel"); return;
    }
    if (sel.dataset.k===b.dataset.k){
      [sel,b].forEach(x=>{ x.classList.remove("sel"); x.classList.add("done"); x.disabled=true; }); sel=null; done++;
      if (done===round.length){ clearInterval(timer); const secs=Math.round((Date.now()-t0)/1000);
        setTimeout(()=>result(stage,g,Math.max(0,round.length-errors),round.length,"",`All matched in ${secs} seconds with ${errors} mistake${errors===1?"":"s"}. Each mistake costs a point.`),400); }
    } else {
      errors++; const a=sel; [a,b].forEach(x=>x.classList.add("shake"));
      setTimeout(()=>[a,b].forEach(x=>x.classList.remove("shake","sel")),500); sel=null;
    }
  });
}

/* ---------- Binary sorter ---------- */
function sorter(stage, g, items, labels, howto){
  let i=0, score=0, streak=0, bestStreak=0; const missed=[];
  const draw = () => {
    if (i>=items.length) return result(stage,g,score,items.length,
      `<p>Longest streak: <b class="streak">${bestStreak}</b></p>${missed.length?`<div class="review">${missed.map(m=>`<div><b>${esc(m[0])}</b><br>${esc(m[1])}</div>`).join("")}</div>`:""}`);
    const it = items[i];
    meter(`${i+1} of ${items.length} · Streak ${streak}`);
    stage.innerHTML = `<div class="progress"><i style="width:${i/items.length*100}%"></i></div><div class="panel">
      <p class="howto">${howto}</p>
      <div class="sortcard"><div class="item">${esc(it.text)}</div>${it.sub?`<div class="sub">${esc(it.sub)}</div>`:""}</div>
      <div class="bins">${labels.map(l=>`<button class="bin" data-v="${l[0]}">${l[1]}<small>${l[2]}</small></button>`).join("")}</div>
      <div id="fb"></div></div>`;
    stage.querySelectorAll(".bin").forEach(b=>b.onclick=()=>{
      const ok = b.dataset.v===it.answer;
      stage.querySelectorAll(".bin").forEach(x=>{ x.disabled=true; x.style.borderColor = x.dataset.v===it.answer ? "var(--good)" : (x===b?"var(--bad)":""); });
      if (ok){ score++; streak++; bestStreak=Math.max(bestStreak,streak); } else { streak=0; missed.push([it.text, it.why]); }
      $("#fb").innerHTML = `<div class="feedback ${ok?"ok":"no"}"><b>${ok?"Correct.":"Not quite."}</b>${esc(it.why)}</div>
        <div class="row"><button class="btn" id="next">${i+1<items.length?"Next":"See results"}</button>${streak>=3?`<span class="streak">${streak} in a row</span>`:""}</div>`;
      $("#next").onclick=()=>{ i++; draw(); }; $("#next").focus();
    });
  };
  draw();
}

/* ---------- Order ---------- */
function gOrder(stage,g){
  const sets = shuffle(ORDERS.filter(o=>inTopic(o.topic)).length?ORDERS.filter(o=>inTopic(o.topic)):ORDERS);
  let si=0, score=0, total=0;
  const draw = () => {
    if (si>=sets.length) return result(stage,g,score,total,"",`You placed ${score} of ${total} steps correctly on your first check.`);
    const set = sets[si]; let cur = shuffle(set.items);
    while (cur.join()===set.items.join()) cur = shuffle(set.items);
    let checked=false;
    meter(`Sequence ${si+1} of ${sets.length}`);
    const render = () => {
      stage.innerHTML = `<div class="progress"><i style="width:${si/sets.length*100}%"></i></div><div class="panel">
        <span class="tag">${TOPICS[set.topic]}</span><div class="q">${esc(set.name)}</div>
        <p class="howto">Use the arrows to put the steps in order, from first to last.</p>
        <ol class="olist">${cur.map((t,k)=>`<li class="${checked?(t===set.items[k]?"right":"wrong"):""}"><span class="n">${k+1}</span><span class="t">${esc(t)}</span>
          <button class="mv" data-k="${k}" data-d="-1" aria-label="Move up" ${k===0||checked?"disabled":""}>↑</button>
          <button class="mv" data-k="${k}" data-d="1" aria-label="Move down" ${k===cur.length-1||checked?"disabled":""}>↓</button></li>`).join("")}</ol>
        <div id="fb"></div>
        <div class="row">${checked?`<button class="btn" id="next">${si+1<sets.length?"Next sequence":"See results"}</button>`:`<button class="btn" id="check">Check order</button>`}</div></div>`;
      stage.querySelectorAll(".mv").forEach(b=>b.onclick=()=>{ const k=+b.dataset.k, d=+b.dataset.d; [cur[k],cur[k+d]]=[cur[k+d],cur[k]]; render();
        const nb = stage.querySelector(`.mv[data-k="${k+d}"][data-d="${d}"]`) || stage.querySelector(`.mv[data-k="${k+d}"]`); if (nb) nb.focus(); });
      if (checked){
        const right = cur.filter((t,k)=>t===set.items[k]).length;
        $("#fb").innerHTML = `<div class="feedback ${right===cur.length?"ok":"no"}" style="margin-top:14px"><b>${right} of ${cur.length} in the right place.</b>${right<cur.length?"The correct order: "+set.items.map((t,k)=>`${k+1}. ${esc(t)}`).join(" · "):"Perfect sequence."}</div>`;
        $("#next").onclick=()=>{ si++; draw(); };
      } else $("#check").onclick=()=>{ checked=true; const r=cur.filter((t,k)=>t===set.items[k]).length; score+=r; total+=cur.length; render(); };
    };
    render();
  };
  draw();
}

    stage.innerHTML = `<div class="row" style="margin-top:0;margin-bottom:16px">
        <div class="toggle" role="group" aria-label="Synagogue type"><button data-t="O" aria-pressed="${type==="O"}">Orthodox</button><button data-t="R" aria-pressed="${type==="R"}">Reform</button></div>
        <div class="toggle" role="group" aria-label="Mode"><button data-m="explore" aria-pressed="${mode==="explore"}">Explore</button><button data-m="find" aria-pressed="${mode==="find"}">Find it</button></div></div>
      <div class="panel syn"><div>${synSVG(type)}</div>
      <div class="info" id="info">${mode==="explore" ? `<span class="tag">Tap any feature</span><h3 style="margin-top:8px">${f.name}</h3><p>${f.text}</p>
        <div class="diff"><div><b>Orthodox</b>${f.o}</div><div><b>Reform</b>${f.r}</div></div>`
        : ti<targets.length ? `<span class="tag">${ti+1} of ${targets.length} · Score ${score}</span><h3 style="margin-top:8px">Find: ${SYN[targets[ti]].name}</h3><p class="howto">Tap it on the floor plan. First-try finds score a point.</p><div id="fb"></div>`
        : `<span class="tag">Finished</span><h3 style="margin-top:8px">${score} of ${targets.length} found first time</h3><div class="row"><button class="btn" id="redo">Play again</button><button class="btn ghost" id="toEx">Back to exploring</button></div>`}
      </div></div>`;
    stage.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ type=b.dataset.t; render(); });
    stage.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ mode=b.dataset.m; if(mode==="find") startFind(); render(); });
    if (mode==="explore") stage.querySelectorAll(`.hs[data-f="${sel}"]`).forEach(h=>h.classList.add("found"));
    stage.querySelectorAll(".hs").forEach(h=>{
      const act = ()=>{
        if (mode==="explore"){ sel=h.dataset.f; render(); return; }
        if (ti>=targets.length) return;
        if (h.dataset.f===targets[ti]){ if(firstTry) score++; ti++; firstTry=true; if (ti===targets.length) record(g.id, Math.round(score/targets.length*100)); render(); }
        else { firstTry=false; h.classList.add("miss"); setTimeout(()=>h.classList.remove("miss"),600);
          const fb=$("#fb"); if(fb) fb.innerHTML=`<div class="feedback no">That is the ${SYN[h.dataset.f].name.toLowerCase()}. Try again.</div>`; }
      };
      h.onclick=act; h.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); act(); } };
    });
    const r=$("#redo"); if(r) r.onclick=()=>{ startFind(); render(); };
    const x=$("#toEx"); if(x) x.onclick=()=>{ mode="explore"; render(); };
    meter(type==="O"?"Orthodox layout":"Reform layout");
  };
  const startFind = ()=>{ targets=shuffle(Object.keys(SYN)); ti=0; score=0; firstTry=true; };
  render();
}

/* ---------- Seder plate ---------- */
function gSeder(stage,g){
  // Standard arrangement (Ari): zeroa top right, beitzah top left, maror centre, charoset middle right, karpas middle left, chazeret bottom centre
  const P = {zeroa:[290,110], beitzah:[130,110], maror:[210,180], charoset:[300,240], karpas:[120,240], chazeret:[210,310]};
  const order = shuffle(SEDER); let i=0, score=0, first=true;
  const draw = () => {
    if (i>=order.length) return result(stage,g,score,order.length,`<div class="review" style="text-align:left">${SEDER.map(s=>`<div style="background:var(--soft)"><b>${s.name}</b><br>${s.mean}</div>`).join("")}</div>`,
      "Three pieces of unleavened bread and a bowl of salt water sit beside the plate. Four cups of wine are drunk, and a cup is poured for the prophet Elijah.");
    const it = order[i];
    meter(`${i+1} of ${order.length} · Score ${score}`);
    stage.innerHTML = `<div class="progress"><i style="width:${i/order.length*100}%"></i></div><div class="panel syn plate">
      <svg viewBox="0 0 420 410" role="img" aria-label="Pesach plate">
        <circle cx="210" cy="205" r="195" fill="var(--soft)" stroke="var(--accent)" stroke-width="3"/>
        <circle cx="210" cy="205" r="180" fill="none" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 6"/>
        ${SEDER.map(s=>{ const [x,y]=P[s.id]; return `<g class="hs" data-id="${s.id}" tabindex="0" role="button" aria-label="${s.name}">
          <circle class="shape" cx="${x}" cy="${y}" r="40" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>
          <text x="${x}" y="${y+5-(s.lines.length-1)*9}" text-anchor="middle" font-size="15" font-weight="600" fill="var(--ink)" font-family="Rubik, sans-serif">${s.lines.map((l,k)=>`<tspan x="${x}" dy="${k?18:0}">${l}</tspan>`).join("")}</text></g>`; }).join("")}
      </svg>
      <div class="info"><span class="tag">Pesach</span><p class="howto" style="margin-top:10px">Which item on the Pesach plate stands for…</p>
        <h3>${it.mean}</h3><div id="fb"></div></div></div>`;
    stage.querySelectorAll(".hs").forEach(h=>{
      const act=()=>{
        if (h.dataset.id===it.id){ if(first) score++; h.classList.add("found");
          $("#fb").innerHTML=`<div class="feedback ok"><b>Correct: ${it.name}.</b></div><div class="row"><button class="btn" id="next">${i+1<order.length?"Next":"See results"}</button></div>`;
          stage.querySelectorAll(".hs").forEach(x=>x.onclick=null); $("#next").onclick=()=>{ i++; first=true; draw(); }; $("#next").focus();
        } else { first=false; h.classList.add("miss"); setTimeout(()=>h.classList.remove("miss"),600);
          const s = SEDER.find(x=>x.id===h.dataset.id); $("#fb").innerHTML=`<div class="feedback no"><b>Not that one.</b>${s.name} stands for: ${s.mean.charAt(0).toLowerCase()+s.mean.slice(1)}.</div>`; }
      };
      h.onclick=act; h.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); act(); } };
    });
  };
  draw();
}

/* ---------- Argument builder ---------- */
function gArgs(stage,g){
  const pool = ARGS.filter(a=>inTopic(a.topic));
  const A = shuffle(pool.length?pool:ARGS)[0];
  const items = shuffle(A.items); let i=0, score=0; const F=[], AG=[];
  const draw = () => {
    meter(`${Math.min(i+1,items.length)} of ${items.length} · Score ${score}`);
    const done = i>=items.length;
    if (done) record(g.id, Math.round(score/items.length*100));
    stage.innerHTML = `<div class="progress"><i style="width:${i/items.length*100}%"></i></div><div class="panel">
      <span class="tag">Evaluate this statement (12 marks)</span>
      <div class="statement">"${esc(A.s)}"</div>
      ${done ? `<div class="feedback ok"><b>${score} of ${items.length} sorted correctly.</b>This is your plan. Develop each argument, link it to Jewish teaching, then judge which side is stronger.</div>`
        : `<div class="sortcard" style="padding:20px 16px"><div style="font-size:17px">${esc(items[i][0])}</div></div>
           <div class="bins"><button class="bin" data-v="F">Supports<small>Agrees with the statement</small></button><button class="bin" data-v="A">Challenges<small>Argues against it</small></button></div><div id="fb"></div>`}
      <div class="argcols"><div class="argcol"><h4>Supports</h4><ul>${F.map(x=>`<li>${esc(x)}</li>`).join("")||'<li style="list-style:none;color:var(--muted)">Arguments will collect here</li>'}</ul></div>
        <div class="argcol"><h4>Challenges</h4><ul>${AG.map(x=>`<li>${esc(x)}</li>`).join("")||'<li style="list-style:none;color:var(--muted)">Arguments will collect here</li>'}</ul></div></div>
      ${done ? `<div class="tips"><b>Writing your conclusion</b><ul>${A.tips.map(t=>`<li>${esc(t)}</li>`).join("")}
        <li>A top-band answer gives reasoned arguments on both sides, uses relevant religious teaching, and reaches a justified conclusion. Up to 3 extra marks are given for spelling, punctuation and grammar on some 12-mark questions.</li></ul></div>
        <div class="row"><button class="btn" id="again">Try another statement</button><button class="btn ghost" id="home2">All games</button></div>` : ""}</div>`;
    if (done){ $("#again").onclick=()=>open(g.id); $("#home2").onclick=home; return; }
    stage.querySelectorAll(".bin").forEach(b=>b.onclick=()=>{
      const it=items[i], ok=b.dataset.v===it[1]; if(ok) score++;
      (it[1]==="F"?F:AG).push(it[0]);
      stage.querySelectorAll(".bin").forEach(x=>{ x.disabled=true; x.style.borderColor = x.dataset.v===it[1]?"var(--good)":(x===b?"var(--bad)":""); });
      $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}"><b>${ok?"Correct.":"Not quite."}</b>This ${it[1]==="F"?"supports":"challenges"} the statement.</div><div class="row"><button class="btn" id="next">Next</button></div>`;
      $("#next").onclick=()=>{ i++; draw(); }; $("#next").focus();
    });
  };
  draw();
}

home();
</script>
